<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Gradient Background for the Icon -->
  <defs>
    <linearGradient id="mooduitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" /> <!-- Navy Blue -->
      <stop offset="100%" stop-color="#F97316" /> <!-- Orange Accent -->
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Circle background with subtle shadow feel -->
  <circle cx="50" cy="50" r="46" fill="url(#mooduitGrad)" />

  <!-- Cute cat face / financial mascot -->
  <!-- Cat Ears -->
  <polygon points="28,40 40,25 44,42" fill="#FFFFFF" />
  <polygon points="32,38 39,28 42,39" fill="#F97316" />
  
  <polygon points="72,40 60,25 56,42" fill="#FFFFFF" />
  <polygon points="68,38 61,28 58,39" fill="#F97316" />

  <!-- Cat Head -->
  <path d="M30,48 C30,36 70,36 70,48 C70,62 30,62 30,48 Z" fill="#FFFFFF" />

  <!-- Eyes (sparkling, cute) -->
  <circle cx="42" cy="46" r="3" fill="#1E3A8A" />
  <circle cx="43" cy="45" r="1" fill="#FFFFFF" />
  
  <circle cx="58" cy="46" r="3" fill="#1E3A8A" />
  <circle cx="57" cy="45" r="1" fill="#FFFFFF" />

  <!-- Nose & Whiskers -->
  <polygon points="50,51 48,49 52,49" fill="#F97316" />
  <!-- Whiskers -->
  <line x1="26" y1="50" x2="36" y2="51" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" />
  <line x1="25" y1="54" x2="35" y2="53" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" />
  
  <line x1="74" y1="50" x2="64" y2="51" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" />
  <line x1="75" y1="54" x2="65" y2="53" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" />

  <!-- Smile -->
  <path d="M47,53 Q50,55 53,53" fill="none" stroke="#1E3A8A" stroke-width="1.5" stroke-linecap="round" />

  <!-- Gold Coin overlay representing financial advisor/wealth -->
  <circle cx="50" cy="72" r="14" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="2" />
  <!-- Dollar/Rupiah symbol inside the coin -->
  <text x="50" y="77" font-family="'Inter', sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle">Rp</text>

  <!-- Sparkles of wealth -->
  <path d="M22,25 L24,29 L28,30 L24,31 L22,35 L20,31 L16,30 L20,29 Z" fill="#FBBF24" />
  <path d="M80,25 L81,28 L84,29 L81,30 L80,33 L79,30 L76,29 L79,28 Z" fill="#FBBF24" />
</svg>
